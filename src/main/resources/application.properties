spring.config.import=optional:file:.env[.properties]
spring.application.name=syndica-api

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}/${POSTGRES_DB}?sslmode=require
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=syndica-api
security.jwt.access-token-expiration=15m
security.jwt.refresh-token-expiration=1h